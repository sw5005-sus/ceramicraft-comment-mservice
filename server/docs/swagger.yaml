definitions:
  data.BaseResponse:
    properties:
      code:
        type: integer
      data: {}
      err_msg:
        type: string
    type: object
  types.CreateReviewRequest:
    properties:
      content:
        type: string
      is_anonymous:
        type: boolean
      parentID:
        type: string
      pic_info:
        items:
          type: string
        type: array
      productID:
        type: integer
      stars:
        type: integer
    type: object
  types.LikeRequest:
    properties:
      review_id:
        type: string
    type: object
  types.ListReviewRequest:
    properties:
      product_id:
        type: integer
      stars:
        description: 0 means any stars
        type: integer
    type: object
  types.ListReviewResponse:
    properties:
      pinned_review:
        $ref: '#/definitions/types.ReviewInfo'
      review_list:
        items:
          $ref: '#/definitions/types.ReviewInfo'
        type: array
    type: object
  types.PinReviewRequest:
    properties:
      is_pinned:
        type: boolean
    type: object
  types.ReviewInfo:
    properties:
      content:
        type: string
      created_at:
        type: string
      current_user_liked:
        type: boolean
      id:
        type: string
      is_anonymous:
        type: boolean
      is_pinned:
        type: boolean
      likes:
        type: integer
      parent_id:
        type: string
      pic_info:
        items:
          type: string
        type: array
      product_id:
        type: integer
      stars:
        type: integer
      user_id:
        type: integer
    type: object
  types.UpdateReviewStatusRequest:
    properties:
      auto_flag:
        description: optional
        type: string
      is_harmful:
        description: optional
        type: boolean
      is_mismatch:
        description: optional
        type: boolean
      review_id:
        description: required
        type: string
      status:
        description: 'required: pending / processing / approved / hidden / rejected'
        type: string
    type: object
info:
  contact: {}
paths:
  /comment-ms/v1/customer/reviews:
    post:
      consumes:
      - application/json
      description: Create an review record.
      parameters:
      - description: CreateReviewRequest
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/types.CreateReviewRequest'
      - description: Client identifier
        enum:
        - customer
        - merchant
        in: path
        name: client
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.CreateReviewRequest'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  type: string
              type: object
      summary: Review Create
      tags:
      - Review
